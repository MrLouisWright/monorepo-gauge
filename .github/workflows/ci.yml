name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [18, 20, 22] }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '${{ matrix.node }}' }
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
      - name: Require + import from packed tarball
        run: |
          npm pack --silent
          mkdir -p /tmp/smoke && cd /tmp/smoke && npm init -y >/dev/null && npm i "$GITHUB_WORKSPACE"/monorepo-gauge-*.tgz
          node -e "const m=require('monorepo-gauge'); if(!Object.keys(m).length) process.exit(1)"
          node --input-type=module -e "const m=await import('monorepo-gauge'); if(!Object.keys(m).length) process.exit(1)"
      - name: Dogfood
        run: |
          node bin/monorepo-gauge.js test/fixtures/clean --fail-on low
          node bin/monorepo-gauge.js test/fixtures/messy --fail-on none
